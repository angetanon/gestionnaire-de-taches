spring:
  application:
    name: gestionnaire-de-taches
#  datasource:
#    url: jdbc:postgresql://localhost:5432/tasks_db
#    username: admin
#    password: ChangeMe_123
#    driver-class-name: org.postgresql.Driver
  datasource:
    url: jdbc:h2:mem:tasks_db
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings.trace: false
      settings.web-allow-others: false
  mvc:
    problemdetails:
      enabled: true
  # Enable initialization of the database with the data.sql file
  sql:
    init:
      mode: always
      data-locations: classpath:db/h2/data.sql
server:
  port: 8082
